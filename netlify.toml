# Static. There is no build step: the page is HTML, one stylesheet inlined in
# the head, two scripts and four woff2 files. Nothing to compile, so nothing
# that can fail at deploy time.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
